<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#131314" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gabby" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="screen-orientation" content="portrait" />
  <meta name="x5-orientation" content="portrait" />
  <title>Gabby - Your AI Assistant</title>
  <meta name="description"
    content="Experience the future of intelligent assistance with Gabby. Built for performance and style." />
  <script>
    // Automatic self-healing: detect stale cached bundles or MIME errors and refresh seamlessly
    window.addEventListener('vite:preloadError', function () {
      window.location.reload();
    });
    window.addEventListener('error', function (e) {
      var msg = (e && e.message) || '';
      var target = e && e.target;
      var isModuleErr = (target && target.tagName === 'SCRIPT') ||
        msg.indexOf('Failed to load module script') !== -1 ||
        msg.indexOf('MIME type of "text/html"') !== -1 ||
        msg.indexOf('Strict MIME type') !== -1;

      if (isModuleErr) {
        var storageKey = 'gabby_sw_heal_ts';
        var lastHeal = sessionStorage.getItem(storageKey);
        var now = Date.now();
        if (!lastHeal || (now - parseInt(lastHeal, 10)) > 6000) {
          sessionStorage.setItem(storageKey, String(now));
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
              if ('caches' in window) {
                caches.keys().then(function (keys) {
                  for (var j = 0; j < keys.length; j++) {
                    caches.delete(keys[j]);
                  }
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          } else {
            window.location.reload();
          }
        }
      }
    }, true);
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
